[project]
name = "wanderland-reconstruction"
version = "0.1.0"
description = "Wanderland - Reconstruction Module"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imageio[ffmpeg]>=2.0.0",
    "laspy>=2.0.0",
    "matplotlib>=3.7.0",
    "numpy<2.0.0",
    "opencv-python>=4.8.0.0",
    "pillow>=10.0.0",
    "pycolmap @ git+https://github.com/rmbrualla/pycolmap@cc7ea4b7301720ac29287dbe450952511b32125e",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "splines>=0.3.0",
    "tensorboard>=2.13.0",
    "tensorly>=0.8.0",
    "torchmetrics[image]>=1.0.0",
    "tqdm>=4.0.0",
    "tyro>=0.8.8",
    "ultralytics>=8.0.0",
    "viser>=0.2.0",
    "wandb>=0.16.0",
    # Install torch/torchvision/torchaudio as a matching triplet for your platform (CPU/CUDA/ROCm).
    "torch>=2.0.0",
    # SSIM loss (CUDA extension) used by gsplat/examples/simple_trainer.py
    "fused-ssim @ git+https://github.com/rahul-goel/fused-ssim@328dc9836f513d00c4b5bc38fe30478b4435cbb5",
    # Viewer dependency (used by gsplat/examples/simple_trainer.py)
    "nerfview @ git+https://github.com/nerfstudio-project/nerfview@4538024fe0d15fd1a0e4d760f3695fc44ca72787",
]

[tool.uv.extra-build-dependencies]
fused-ssim = ["torch"]
